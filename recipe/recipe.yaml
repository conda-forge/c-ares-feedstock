schema_version: 1

context:
  version: "1.34.9"

recipe:
  name: c-ares
  version: ${{ version }}

source:
  url: https://github.com/c-ares/c-ares/releases/download/v${{ version }}/c-ares-${{ version }}.tar.gz
  sha256: 9364b70a12eb59a06830fb488d9357f90100dff0d98b23ea3593a183d43e6f2f

build:
  number: 0

outputs:
  - package:
      name: c-ares
    build:
      script: build_output
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - if: win
          then: cmake
        # cmake on unix depends on c-ares. This breaks the cycle.
        - if: unix
          then:
            - cmake-no-system
            - ninja
      run_exports:
        - ${{ pin_subpackage("c-ares", upper_bound="x") }}
    tests:
      - package_contents:
          include:
            - ares.h
          lib:
            - cares
          files:
            not_exists:
              - if: unix
                then:
                  - lib/libcares.a
                  - lib/libcares_static.a
              - if: win
                then: Library/lib/cares_static.lib
  - package:
      name: c-ares-static
    build:
      script: build_output
      files:
        - if: unix
          then: lib/libcares.a
        - if: win
          then: Library/lib/cares_static.lib
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - if: win
          then: cmake
        # cmake on unix depends on c-ares. This breaks the cycle.
        - if: unix
          then:
            - cmake-no-system
            - ninja
      host:
        - ${{ pin_subpackage("c-ares", exact=True) }}
      run:
        # the headers, cmake & pkgconfig metadata live in the shared output
        - ${{ pin_subpackage("c-ares", exact=True) }}
    tests:
      - package_contents:
          files:
            exists:
              - if: unix
                then: lib/libcares.a
              - if: win
                then: Library/lib/cares_static.lib

about:
  license: MIT
  license_file: LICENSE.md
  summary: This is c-ares, an asynchronous resolver library
  homepage: https://c-ares.haxx.se/

extra:
  recipe-maintainers:
    - ocefpaf
    - wesm
    - xhochy
